{% extends './layouts/layout1.html' %}
{% load static %}

{% block title %}Feed{% endblock %}

{% block main_content %}
    <div id="feed">
        {% for post in page_obj %}
        <div class="post">
            <h3>{{ post.titulo }}</h3>
            <p>{{ post.conteudo }}</p>
            <small>{{ post.criado_em }}</small>
        </div>
        {% endfor %}
    </div>

    <div id="loading" style="display:none;">Carregando...</div>

<script src="{% static 'main.js' %}"></script>
{% endblock %}
