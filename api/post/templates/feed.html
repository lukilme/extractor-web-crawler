{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Feed</title>
    <style>
        .post {
            border-bottom: 1px solid #ccc;
            margin-bottom: 16px;
            padding-bottom: 8px;
        }
    </style>
</head>

<body>
    <h1>Feed</h1>

    <div id="feed">
        {% for post in page_obj %}
        <div class="post">
            <h3>{{ post.titulo }}</h3>
            <p>{{ post.conteudo }}</p>
            <small>{{ post.criado_em }}</small>
        </div>
        {% endfor %}
    </div>

    <div id="loading" style="display:none;">Carregando...</div>
</body>
<script src="{% static 'main.js' %}"></script>
</html>
